name: Actualiser Steam et publier

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 4 relevés/jour ; GitHub peut différer ou omettre certains lancements planifiés.
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamelab-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Récupérer les prix et visuels de Steam (France)
        run: python3 scripts/update_steam.py
      - name: Garder le dernier relevé dans le dépôt
        run: |
          if ! git diff --quiet -- steam-data.json; then
            git config user.name "gamelab-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add steam-data.json
            git commit -m "Actualiser relevé Steam"
            git push
          fi
      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Regrouper les fichiers publics
        run: |
          mkdir -p _site
          cp index.html style.css script.js catalogue.json steam-data.json _site/
          touch _site/.nojekyll
      - name: Charger le site statique
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
