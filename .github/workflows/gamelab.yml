
name: Actualiser Steam et publier

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Actualisation 4 fois par jour (UTC)
    - cron: '17 4,10,16,22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gamelab-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier les fichiers
        run: |
          echo "Fichiers du projet :"
          ls -la

      - name: Récupérer les prix Steam
        run: python3 update_steam.py

      - name: Enregistrer les prix Steam
        run: |
          if ! git diff --quiet -- steam-data.json; then
            git config user.name "gamelab-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add steam-data.json
            git commit -m "Actualiser les prix Steam"
            git push
          fi

      - name: Préparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer les fichiers du site
        run: |
          mkdir -p _site

          cp index.html _site/
          cp style.css _site/
          cp script.js _site/
          cp config.js _site/
          cp catalogue.json _site/
          cp steam-data.json _site/

          touch _site/.nojekyll

      - name: Envoyer les fichiers à GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Publier GameLab
        id: deployment
        uses: actions/deploy-pages@v4
